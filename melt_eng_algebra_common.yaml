# encoding: utf-8

# 通用派生（前置）：英文数字与符号读音展开
# 置于各方案中文数字/符号谐音派生之前，保留原始符号以便中文规则匹配前导符号（如 .NET、.gitignore）。
algebra_common_pre:
  # 数字派生
  - derive/1([4-79])/$1teen/
  - derive/11/eleven/
  - derive/12/twelve/
  - derive/13/thirteen/
  - derive/15/fifteen/
  - derive/18/eighteen/
  - derive/0/o/ # 如 1000 -> oneOOO
  - derive/0/O/
  - derive/0/zero/
  - derive/1/one/
  - derive/10/ten/
  - derive/2/to/
  - derive/2/two/
  - derive/3/three/
  - derive/4/for/
  - derive/4/four/
  - derive/5/five/
  - derive/6/six/
  - derive/7/seven/
  - derive/8/eight/
  - derive/9/nine/
  # 符号派生
  - derive/\+/plus/
  - derive/\./dot/
  - derive/@/at/
  - derive/-/hyphen/
  - derive/#/hash/
  - derive/#/number/
  - derive/#/sharp/
  - derive/♯/sharp/
  - derive / slash
  - derive/&/and/
  - derive/%/percent/

# 通用派生（后置）：去除特殊符号、禁用非字母数字开头编码、大小写派生
# 置于各方案中文数字/符号谐音派生之后，确保前导符号词条可派生中文谐音且中文谐音编码获得完整大小写变体。
algebra_common_post:
  # 派生无单个特殊字符的拼写
  - derive/[.]//
  - derive/[+]//
  - derive/[@]//
  - derive/[-]//
  - derive/[_]//
  # 派生无任何非字母数字字符的拼写
  - derive/[^a-zA-Z0-9]//
  # 禁用非英文、数字开头的编码
  - erase/^[^a-zA-Z0-9].+$/
  # 全小写
  - derive/^.+$/\L$0/
  # 全大写
  - derive/^.+$/\U$0/
  # 首字母大写
  - derive/^./\U$0/
  # 前 2~4 个字母大写（配合 autocap_filter 覆盖误按 Shift 与前两位大写转全大写，大幅缩减 melt_eng.prism.bin 体积）
  - derive/^([a-z]{2})/\U$1/
  - derive/^([a-z]{3})/\U$1/
  - derive/^([a-z]{4})/\U$1/
  # - derive/^([a-z]{5})/\U$1/
  # - derive/^([a-z]{6})/\U$1/
  # - derive/^([a-z]{7})/\U$1/
  # - derive/^([a-z]{8})/\U$1/
  # - derive/^([a-z]{9})/\U$1/
  # - derive/^([a-z]{10})/\U$1/
