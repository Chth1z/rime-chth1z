patch:
  schema/name: "白霜全拼"
  # 僅掛載實際使用的英文子方案，不再載入未使用的部件拆字與墨奇輔助碼詞庫
  schema/dependencies:
    - melt_eng
  menu/page_size: 5

  # 萬象 400 MB LTS 語法模型（對齊白霜評測基準參數）
  grammar:
    language: wanxiang-lts-zh-hans
    non_collocation_penalty: -4
    collocation_max_length: 5
    collocation_min_length: 2
    collocation_penalty: -14
  translator/contextual_suggestions: true
  translator/max_sentences: 3
  translator/max_homophones: 8
  translator/max_homographs: 2

  # 移除反引號 ` 始碼保留字（不再啟用墨奇輔助碼，讓 ` 直接上屏）
  speller/alphabet: "zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA/"

  # 簡繁切換：預設臺灣繁體含臺灣慣用語（s2twp.json：字形＋詞彙轉換）
  # F4 單頁一級選單：1 當前方案 / 2 臺繁→簡體 / 3 半角→全角 / 4 中標→英標 / 5 翻譯關→開 / 6 另一方案
  traditionalize/opencc_config: s2twp.json
  switches:
    - name: traditionalization
      reset: 1
      states: [ 簡體, 臺繁 ]
    - name: full_shape
      states: [ 半角, 全角 ]
    - name: ascii_punct
      states: [ 中標, 英標 ]
    - name: chinese_english
      reset: 0
      states: [ 翻譯關, 翻譯開 ]
    - name: ascii_mode
    - name: emoji
      reset: 0
    - name: pin_cand
      reset: 1

  # 收斂／停用會誤攔截大寫英文或觸發上游 Lua 崩潰的規則
  recognizer/patterns/calculator: "^/vs.*$"
  calculator/trigger: "/vs"
  recognizer/patterns/gregorian_to_lunar: "^$"
  recognizer/patterns/number: "^$"
  recognizer/patterns/unicode: "^$"
  recognizer/patterns/radical_lookup: "^$"

  # 修復上游 pin_cand_filter 單鍵空掃 101 候選的性能 Bug（實測全拼同樣無法於單鍵生成 2-3 字詞）
  pin_cand_filter:
    - q	去
    - w	我
    - e	而
    - r	人
    - t	他
    - y	有
    - sh	是
    - ch	出
    - o	哦
    - p	配
    - a	啊
    - s	算
    - d	的
    - f	非
    - g	个
    - h	和
    - j	就
    - k	可
    - l	了
    - z	在
    - x	小
    - c	从
    - zh	这
    - b	吧
    - n	你
    - m	吗

  # 精簡引擎管線：將 pin_cand_filter 置於 corrector 之前，避免拉取緩衝候選時連累 corrector 跑滿 101 次
  engine/segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  engine/translators:
    - punct_translator
    - script_translator
    - lua_translator@*date_translator
    - lua_translator@*lunar
    - table_translator@custom_phrase
    - table_translator@melt_eng
    - table_translator@cn_en
    - lua_translator@*force_gc
    - lua_translator@*calculator
  engine/filters:
    - lua_filter@*pin_cand_filter
    - lua_filter@*corrector
    - lua_filter@*autocap_filter
    - lua_filter@*reduce_english_filter
    - simplifier@emoji
    - simplifier@chinese_english
    - simplifier@traditionalize
    - uniquifier
