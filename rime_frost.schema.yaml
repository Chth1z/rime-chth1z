# Rime schema
# encoding: utf-8
# 白霜全拼（基於白霜拼音與霧凇拼音深度客製化）

schema:
  schema_id: rime_frost
  name: 白霜全拼
  version: "2026-11-23"
  author:
    - Dvel
    - gaboolic
    - Chth1z
  description: |
    白霜詞庫＋萬象語法模型＋臺灣繁體（s2twp）＋全拼
    https://github.com/Chth1z/rime-chth1z
  dependencies:
    - melt_eng

menu:
  page_size: 5

# 可切換開關不設 reset，交由 default.yaml 的 save_options 寫入 user.yaml 持久化，重新部署後保留上次選擇
switches:
  - name: traditionalization
    states: [ 簡體, 臺繁 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 中標, 英標 ]
  - name: chinese_english
    states: [ 翻譯關, 翻譯開 ]
  - name: ascii_mode
  - name: emoji
  - name: pin_cand
    reset: 1
  - name: neural_rerank
    reset: 1

engine:
  processors:
    - lua_processor@*select_character          # 以詞定字（支援長句與游標中段）
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - lua_translator@*date_translator          # 時間、日期、星期、時間戳
    - lua_translator@*lunar                    # 農曆
    - table_translator@custom_phrase           # 自訂短語 custom_phrase.txt
    - table_translator@melt_eng                # 英文混輸
    - table_translator@cn_en                   # 中英混合詞彙
    - lua_translator@*calculator               # 計算機（/vs 觸發）
  filters:
    - lua_filter@*rime_neural                  # 端側 ONNX 神經整句重排（Chth1z/rime-neural，未安裝或關閉時零開銷透傳）
    - lua_filter@*chth1z_pipeline_filter       # 單遍合併濾鏡：置頂 + 錯音提示 + 英文大小寫 + 短英文降權 + 低頻 GC
    - simplifier@emoji
    - simplifier@chinese_english
    - lua_filter@*tw_dual_filter               # 臺灣繁體雙出：首選 s2twp 臺灣用法，有詞彙差異時次選 s2tw 臺灣正體原詞
    - uniquifier

grammar:
  language: wanxiang-lts-zh-hans
  non_collocation_penalty: -4
  collocation_max_length: 5
  collocation_min_length: 2
  collocation_penalty: -15.5

chth1z_pipeline:
  pin_max_scan: 40
  gc_interval: 16

# 端側神經整句重排（Chth1z/rime-neural）
rime_neural:
  option_name: neural_rerank
  pinyin_layout: auto
  max_candidates: 8
  fusion_weights: [1.0, -1.4, 0.05, 0.15, 0.0]
  p2c_verify_margin: 0.20
  p2c_top1_logit_diff: 2.0
  p2c_top1_min_gram_diff: -2.0
  p2c_top2_logit_diff: 0.5
  enable_uia_context: true
  threads: 0
  min_input_len: 6
  log_feedback: true
  sync_init: false

date_translator:
  date: rq
  time: sj
  week: xq
  datetime: dt
  timestamp: ts

lunar: nl

calculator:
  trigger: "/vs"

corrector: "{comment}"

reduce_english_filter:
  mode: custom
  idx: 2
  words: [
    aid, ann,
    bail, bait, bam, band, bans, bat, bay, bend, bent, benz, bib, bid, bien, biz, boc, bop, bos, bud, buf, bach, bench, bush,
    cab, cad, cain, cam, cans, cap, cas, cef, chad, chan, chap, chef, cher, chew, chic, chin, chip, chit, coup, cum, cunt, cur, couch,
    dab, dag, dal, dam, dent, dew, dial, diet, dim, din, dip, dis, dit, doug, dub, dug, dunn, don,
    fab, fax, fob, fog, foul, fur,
    gag, gail, gain, gal, gam, gaol, ged, gel, ger, guam, gus, gut,
    hail, ham, hank, hans, hat, hay, heil, heir, hem, hep, hud, hum, hung, hunk, hut, hush,
    jim, jug,
    kat,
    lab, lad, lag, laid, lam, laos, lap, lat, lax, lay, led, leg, lex, liam, lib, lid, lied, lien, lies, linn, lip, lit, liz, lob, lug, lund, lung, lux, lash, loch, lush,
    mag, maid, mann, mar, mat, med, mel, mend, mens, ment, mil, mins, mint, mob, moc, mop, mos, mot, mud, mug, mum, mesh,
    nap, nat, nay, neil, nib, nip, noun, nous, nun, nut, nail, nash,
    pac, paid, pail, pain, pair, pak, pal, pam, pans, pant, pap, par, pat, paw, pax, pens, pic, pier, pies, pins, pint, pit, pix, pod, pop, pos, pot, pour, pow, pub, pinch, pouch,
    rand, rant, rent, rep, res, ret, rex, rib, rid, rig, rim, rub, rug, rum, runc, runs, ranch,
    sac, sail, sal, sam, sans, sap, saw, sax, sew, sham, shaw, shin, sig, sin, sip, sis, suit, sung, suns, sup, sur, sus,
    tad, tail, taj, tar, tax, tec, ted, tel, ter, tex, tic, tied, tier, ties, tim, tin, tit, tour, tout, tum,
    wag, wand, womens, wap, wax, weir, won,
    yan, yen,
    zach
  ]

# 僅保留全拼可命中的單編碼／簡碼置頂（移除全拼 e 鍵不可達的「而」，改置頂於 er）
pin_cand_filter:
  - "q\t去"
  - "w\t我"
  - "er\t而"
  - "r\t人"
  - "t\t他"
  - "y\t有"
  - "sh\t是"
  - "ch\t出"
  - "o\t哦"
  - "p\t配"
  - "a\t啊"
  - "s\t算"
  - "d\t的"
  - "f\t非"
  - "g\t个"
  - "h\t和"
  - "j\t就"
  - "k\t可"
  - "l\t了"
  - "z\t在"
  - "x\t小"
  - "c\t从"
  - "zh\t这"
  - "b\t吧"
  - "n\t你"
  - "m\t吗"

translator:
  dictionary: rime_frost
  contextual_suggestions: false
  max_sentences: 8
  sentence_cutoff_threshold: 0.3
  max_homophones: 8
  max_homographs: 2
  spelling_hints: 12
  always_show_comments: true
  initial_quality: 1.2
  comment_format:
    - xform/^/［/
    - xform/$/］/
  preedit_format:
    - xform/([jqxy])v/$1u/
    - xform/([nl])ue/$1ve/

melt_eng:
  dictionary: melt_eng
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 0.7
  comment_format:
    - xform/.*//

cn_en:
  dictionary: ""
  user_dict: en_dicts/cn_en
  db_class: stabledb
  enable_completion: true
  enable_sentence: false
  initial_quality: 0.1
  comment_format:
    - xform/^.+$//

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 99

chinese_english:
  option_name: chinese_english
  opencc_config: chinese_english.json
  tips: char

emoji:
  option_name: emoji
  opencc_config: emoji.json
  inherit_comment: false

tw_dual_filter:
  option_name: traditionalization
  twp_config: s2twp.json
  tw_config: s2tw.json
  tags: [ abc ]

punctuator:
  full_shape:
    __include: default:/punctuator/full_shape
  half_shape:
    __include: default:/punctuator/half_shape
  symbols:
    __include: symbols_v:/symbols

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]|10|[A-Za-z]+)$"
    calculator: "^/vs.*$"

key_binder:
  import_preset: default
  bindings:
    - { when: has_menu, accept: semicolon, send: 2 }

speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA/"
  initials: "zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA"
  delimiter: " '"
  algebra:
    - erase/^hm$/
    - erase/^m$/
    - erase/^n$/
    - erase/^ng$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])v/$1u/
    - fuzz/^([zcs])h(a|e|i|u|ao|ai|ei|an|en|ou|uo|ua|un|ui|uan|uai|uang|ang|eng|ong)$/h$1$2/
    - fuzz/^([wghk])ai$/$1ia/
    - fuzz/^([wfghk])ei$/$1ie/
    - fuzz/^([jqx])ie$/$1ei/
    - fuzz/^([rtysdghklzcn])ao$/$1oa/
    - fuzz/^([ypfm])ou$/$1uo/
    - fuzz/^([wrtypsdfghklzcbnm])ang$/$1nag/
    - fuzz/^([wrtypsdfghklzcbnm])ang$/$1agn/
    - fuzz/^([wrtpsdfghklzcbnm])eng$/$1neg/
    - fuzz/^([wrtpsdfghklzcbnm])eng$/$1egn/
    - fuzz/^([qtypdjlxbnm])ing$/$1nig/
    - fuzz/^([qtypdjlxbnm])ing$/$1ign/
    - fuzz/^([rtysdghklzcn])ong$/$1nog/
    - fuzz/^([rtysdghklzcn])ong$/$1ogn/
    - fuzz/^([qtpdjlxbnm])iao$/$1ioa/
    - fuzz/^([qtpdjlxbnm])iao$/$1oia/
    - fuzz/^([rtsghkzc])ui$/$1iu/
    - fuzz/^([qjlxnm])iu$/$1ui/
    - fuzz/^([qjlxn])iang$/$1aing/
    - fuzz/^([qjlxn])iang$/$1inag/
    - fuzz/^(g|k|h|zh|ch|sh|r)ua$/$1au/
    - fuzz/^(g|h|k|zh|ch|sh)uai$/$1aui/
    - fuzz/^([qrtysdghjklzxcn])uan$/$1aun/
    - fuzz/^([nlyjqx])ue$/$1eu/
    - fuzz/^(g|h|k|zh|ch|sh)uang$/$1aung/
    - fuzz/^(g|h|k|zh|ch|sh)uang$/$1uagn/
    - fuzz/^(g|h|k|zh|ch|sh)uang$/$1unag/
    - fuzz/^(g|h|k|zh|ch|sh)uang$/$1augn/
    - fuzz/^([jqx])iong$/$1inog/
    - fuzz/^([jqx])iong$/$1oing/
    - fuzz/^([jqx])iong$/$1iogn/
    - fuzz/^([jqx])iong$/$1oign/
    - fuzz/^([rtsdghkzc])o(u|ng)$/$1o/
    - fuzz/^([tl])eng$/$1en/
    - fuzz/^([qwrtypsdfghjklzxcbnm])([aeio])ng$/$1ng/
