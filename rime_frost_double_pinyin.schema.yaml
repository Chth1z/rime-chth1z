# Rime schema
# encoding: utf-8
# 自然碼雙拼（主力方案，基於白霜拼音與霧凇拼音深度客製化）

schema:
  schema_id: rime_frost_double_pinyin
  name: 自然碼雙拼
  version: "2026-11-22"
  author:
    - Dvel
    - gaboolic
    - Chth1z
  description: |
    白霜詞庫＋萬象語法模型＋臺灣繁體（s2twp）＋自然碼雙拼
    https://github.com/Chth1z/rime-chth1z
  dependencies:
    - melt_eng

menu:
  page_size: 5

# F4 單頁一級選單：1 當前方案 / 2 臺繁→簡體 / 3 半角→全角 / 4 中標→英標 / 5 翻譯關→開 / 6 另一方案
switches:
  - name: traditionalization
    reset: 1
    states: [ 簡體, 臺繁 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 中標, 英標 ]
  - name: chinese_english
    reset: 0
    states: [ 翻譯關, 翻譯開 ]
  - name: ascii_mode
  - name: emoji
    reset: 0
  - name: pin_cand
    reset: 1

engine:
  processors:
    - lua_processor@*select_character          # 以詞定字（支援長句與游標中段）
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - lua_translator@*date_translator          # 時間、日期、星期、時間戳
    - lua_translator@*lunar                    # 農曆
    - table_translator@custom_phrase           # 自訂短語 custom_phrase.txt
    - table_translator@melt_eng                # 英文混輸
    - table_translator@cn_en                   # 中英混合詞彙
    - lua_translator@*calculator               # 計算機（/vs 觸發）
  filters:
    - lua_filter@*chth1z_pipeline_filter       # 單遍合併濾鏡：置頂 + 錯音提示 + 英文大小寫 + 短英文降權 + 低頻 GC
    - simplifier@emoji
    - simplifier@chinese_english
    - simplifier@traditionalize
    - uniquifier

# 萬象 400 MB LTS 語法模型（對齊白霜評測基準參數）
grammar:
  language: wanxiang-lts-zh-hans
  non_collocation_penalty: -4
  collocation_max_length: 5
  collocation_min_length: 2
  collocation_penalty: -14

chth1z_pipeline:
  pin_max_scan: 40
  gc_interval: 16

date_translator:
  date: date
  time: time
  week: week
  datetime: datetime
  timestamp: timestamp

lunar: lunar

calculator:
  trigger: "/vs"

corrector: "{comment}"

reduce_english_filter:
  mode: custom
  idx: 2
  words: [
    aid, ann,
    bail, bait, bam, band, bans, bat, bay, bend, bent, benz, bib, bid, bien, biz, boc, bop, bos, bud, buf, bach, bench, bush,
    cab, cad, cain, cam, cans, cap, cas, cef, chad, chan, chap, chef, cher, chew, chic, chin, chip, chit, coup, cum, cunt, cur, couch,
    dab, dag, dal, dam, dent, dew, dial, diet, dim, din, dip, dis, dit, doug, dub, dug, dunn,
    fab, fax, fob, fog, foul, fur,
    gag, gail, gain, gal, gam, gaol, ged, gel, ger, guam, gus, gut,
    hail, ham, hank, hans, hat, hay, heil, heir, hem, hep, hud, hum, hung, hunk, hut, hush,
    jim, jug,
    kat,
    lab, lad, lag, laid, lam, laos, lap, lat, lax, lay, led, leg, lex, liam, lib, lid, lied, lien, lies, linn, lip, lit, liz, lob, lug, lund, lung, lux, lash, loch, lush,
    mag, maid, mann, mar, mat, med, mel, mend, mens, ment, mil, mins, mint, mob, moc, mop, mos, mot, mud, mug, mum, mesh,
    nap, nat, nay, neil, nib, nip, noun, nous, nun, nut, nail, nash,
    pac, paid, pail, pain, pair, pak, pal, pam, pans, pant, pap, par, pat, paw, pax, pens, pic, pier, pies, pins, pint, pit, pix, pod, pop, pos, pot, pour, pow, pub, pinch, pouch,
    rand, rant, rent, rep, res, ret, rex, rib, rid, rig, rim, rub, rug, rum, runc, runs, ranch,
    sac, sail, sal, sam, sans, sap, saw, sax, sew, sham, shaw, shin, sig, sin, sip, sis, suit, sung, suns, sup, sur, sus,
    tad, tail, taj, tar, tax, tec, ted, tel, ter, tex, tic, tied, tier, ties, tim, tin, tit, tour, tout, tum,
    wag, wand, womens, wap, wax, weir, won,
    yan, yen,
    zach
  ]

# 僅保留雙拼單鍵可達的 26 個單字置頂，避免掃描不可達多字詞造成空掃
pin_cand_filter:
  - q	去
  - w	我
  - e	而
  - r	人
  - t	他
  - y	有
  - u	是
  - i	出
  - o	哦
  - p	配
  - a	啊
  - s	算
  - d	的
  - f	非
  - g	个
  - h	和
  - j	就
  - k	可
  - l	了
  - z	在
  - x	小
  - c	从
  - v	这
  - b	吧
  - n	你
  - m	吗

translator:
  dictionary: rime_frost
  prism: rime_frost_double_pinyin
  contextual_suggestions: true
  max_sentences: 3
  max_homophones: 8
  max_homographs: 2
  spelling_hints: 8
  always_show_comments: true
  initial_quality: 1.2
  comment_format:
    - xform/^/［/
    - xform/$/］/
  preedit_format: []

melt_eng:
  dictionary: melt_eng
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 1.1
  comment_format:
    - xform/.*//

cn_en:
  dictionary: ""
  user_dict: en_dicts/cn_en_double_pinyin
  db_class: stabledb
  enable_completion: true
  enable_sentence: false
  initial_quality: 0.5
  comment_format:
    - xform/^.+$//

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 99

chinese_english:
  option_name: chinese_english
  opencc_config: chinese_english.json
  tips: char
  comment_format:
    - "xform/-/ /"

emoji:
  option_name: emoji
  opencc_config: emoji.json
  inherit_comment: false

traditionalize:
  option_name: traditionalization
  opencc_config: s2twp.json
  tips: none
  tags: [ abc, number, gregorian_to_lunar ]

punctuator:
  full_shape:
    __include: default:/punctuator/full_shape
  half_shape:
    __include: default:/punctuator/half_shape
  symbols:
    __include: symbols_v:/symbols

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]|10|[A-Za-z]+)$"
    calculator: "^/vs.*$"
    gregorian_to_lunar: "^$"
    number: "^$"
    unicode: "^$"
    radical_lookup: "^$"

key_binder:
  import_preset: default
  bindings:
    - { when: has_menu, accept: semicolon, send: 2 }

speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA/"
  initials: "zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA"
  delimiter: " '"
  algebra:
    - erase/^xx$/
    - derive/^([jqxy])u$/$1v/
    - derive/^([aoe])([ioun])$/$1$1$2/
    - xform/^([aoe])(ng)?$/$1$1$2/
    - xform/iu$/Ⓠ/
    - xform/[iu]a$/Ⓦ/
    - xform/[uv]an$/Ⓡ/
    - xform/[uv]e$/Ⓣ/
    - xform/ing$|uai$/Ⓨ/
    - xform/^sh/Ⓤ/
    - xform/^ch/Ⓘ/
    - xform/^zh/Ⓥ/
    - xform/uo$/Ⓞ/
    - xform/[uv]n$/Ⓟ/
    - xform/(.)i?ong$/$1Ⓢ/
    - xform/[iu]ang$/Ⓓ/
    - xform/(.)en$/$1Ⓕ/
    - xform/(.)eng$/$1Ⓖ/
    - xform/(.)ang$/$1Ⓗ/
    - xform/ian$/Ⓜ/
    - xform/(.)an$/$1Ⓙ/
    - xform/iao$/Ⓒ/
    - xform/(.)ao$/$1Ⓚ/
    - xform/(.)ai$/$1Ⓛ/
    - xform/(.)ei$/$1Ⓩ/
    - xform/ie$/Ⓧ/
    - xform/ui$/Ⓥ/
    - xform/(.)ou$/$1Ⓑ/
    - xform/in$/Ⓝ/
    - xlit/ⓆⓌⓇⓉⓎⓊⒾⓄⓅⓈⒹⒻⒼⒽⓂⒿⒸⓀⓁⓏⓍⓋⒷⓃ/qwrtyuiopsdfghmjcklzxvbn/
