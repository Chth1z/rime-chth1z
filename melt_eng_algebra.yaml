# encoding: utf-8
# 各方案的英文拼写派生规则；通用前置/后置规则从独立文件载入，
# 中文数字与符号谐音位于前置符号展开之后、后置去符号/擦除前导符号/大小写展开之前。

# 全拼
_pre_rime_frost:
  __include: melt_eng_algebra_common:/algebra_common_pre
  __append:
    - derive/(?<!\d)1([1-9])(?!\d)/shi$1/
    - derive/([1-9])0000(?!0)/$1wan/
    - derive/([1-9])000(?!0)/$1qian/
    - derive/([1-9])00(?!0)/$1bai/
    - derive/([2-9])0(?!0)/$1shi/
    - derive/(?<!\d)([2-9])([1-9])(?!\d)/$1shi$2/
    - derive/\./dian/
    - derive/10/shi/
    - derive/0/ling/
    - derive/1/yi/
    - derive/2/er/
    - derive/2/liang/
    - derive/3/san/
    - derive/4/si/
    - derive/5/wu/
    - derive/6/liu/
    - derive/7/qi/
    - derive/8/ba/
    - derive/9/jiu/
    - derive/\+/jia/
    - derive/#/jing/
algebra_rime_frost:
  __include: _pre_rime_frost
  __append:
    __include: melt_eng_algebra_common:/algebra_common_post

