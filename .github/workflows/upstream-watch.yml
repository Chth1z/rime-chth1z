name: Upstream Watch (frost / rime-ice / rime-neural / weasel / wanxiang)

on:
  schedule:
    # Weekly Monday 09:00 UTC+8 (01:00 UTC)
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch-upstreams:
    runs-on: ubuntu-latest
    steps:
      - name: Query upstreams and update rolling tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, urllib.request

          HEADERS = {"User-Agent": "rime-chth1z-upstream-watcher/1.2"}
          if os.environ.get("GH_TOKEN"):
              HEADERS["Authorization"] = f"Bearer {os.environ['GH_TOKEN']}"

          def fetch_json(url, optional=False):
              req = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return json.loads(r.read().decode("utf-8"))
              except Exception as exc:
                  print(f"[WARN] Failed to fetch {url}: {exc}", file=sys.stderr)
                  if optional:
                      return None
                  raise

          frost_lua = fetch_json("https://api.github.com/repos/gaboolic/rime-frost/commits?path=lua&per_page=5", optional=True)
          frost_root = fetch_json("https://api.github.com/repos/gaboolic/rime-frost/commits?per_page=5", optional=True)
          ice_lua = fetch_json("https://api.github.com/repos/iDvel/rime-ice/commits?path=lua&per_page=5", optional=True)
          neural_rel = fetch_json("https://api.github.com/repos/Chth1z/rime-neural/releases/latest", optional=True)
          zhiyi_rels = fetch_json("https://api.github.com/repos/dd1000001000/zhiyi_models/releases?per_page=3", optional=True)
          weasel_rel = fetch_json("https://api.github.com/repos/rime/weasel/releases/tags/latest", optional=True)
          wx_rel = fetch_json("https://api.github.com/repos/amzxyz/rime-wanxiang-data/releases/tags/LTS", optional=True)

          all_fetches = [frost_lua, frost_root, ice_lua, neural_rel, zhiyi_rels, weasel_rel, wx_rel]
          failed_count = sum(1 for item in all_fetches if item is None)
          if failed_count >= 4:
              print(
                  f"[ERROR] {failed_count}/{len(all_fetches)} upstream API fetches failed; "
                  "aborting without overwriting the rolling tracking issue.",
                  file=sys.stderr,
              )
              sys.exit(1)

          def fmt_date(val):
              return (val or "unknown")[:10]

          def fmt_commits(items):
              if not items:
                  return "- (unavailable)"
              lines = []
              for c in items:
                  sha = (c.get("sha") or "")[:8]
                  commit_obj = c.get("commit") or {}
                  date = fmt_date((commit_obj.get("committer") or {}).get("date"))
                  msg = ((commit_obj.get("message") or "").splitlines() or [""])[0]
                  url = c.get("html_url") or ""
                  lines.append(f"- `{date}` [`{sha}`]({url}) {msg}")
              return "\n".join(lines)

          neural_line = (
              f"- **`{neural_rel['tag_name']}`** (published `{fmt_date(neural_rel.get('published_at'))}`) — [{neural_rel['html_url']}]({neural_rel['html_url']})"
              if neural_rel else "- (unavailable)"
          )
          zhiyi_lines = (
              "\n".join(
                  f"- `{fmt_date(r.get('published_at'))}` [`{r['tag_name']}`]({r['html_url']}) {r.get('name') or ''}"
                  for r in zhiyi_rels
              )
              if zhiyi_rels else "- (unavailable)"
          )

          weasel_inst = next((a for a in (weasel_rel or {}).get("assets", []) if a["name"].endswith("installer.exe")), None)
          gram_asset = next((a for a in (wx_rel or {}).get("assets", []) if a["name"] == "wanxiang-lts-zh-hans.gram"), None)

          weasel_line = (
              f"- **{weasel_rel.get('name') or 'latest'}**: `{weasel_inst['name']}` (updated `{fmt_date(weasel_inst.get('updated_at'))}`) — [Download]({weasel_inst['browser_download_url']})"
              if weasel_rel and weasel_inst else "- (unavailable)"
          )
          gram_line = (
              f"- **`wanxiang-lts-zh-hans.gram`**: `{gram_asset['size'] / 1048576:.2f} MB`, updated `{fmt_date(gram_asset.get('updated_at'))}`, digest `{gram_asset.get('digest') or 'n/a'}`"
              if wx_rel and gram_asset else "- (unavailable)"
          )

          body = f"""## 上游多源更新追蹤摘要

          > 此 Issue 由 `.github/workflows/upstream-watch.yml` 每週自動刷新。詞庫由 `sync-upstream-dicts.yml` 自動同步，其餘引擎／插件／客戶端更新在此審閱後按需跟進。

          ### 1. `gaboolic/rime-frost`（最新總覽）
          {fmt_commits(frost_root)}

          ### 2. `gaboolic/rime-frost`（`lua/` 變更）
          {fmt_commits(frost_lua)}

          ### 3. `iDvel/rime-ice`（上游母庫 `lua/` 變更）
          {fmt_commits(ice_lua)}

          ### 4. `Chth1z/rime-neural`（端側神經重排插件）
          {neural_line}

          ### 5. `dd1000001000/zhiyi_models`（ONNX 模型最新發行）
          {zhiyi_lines}

          ### 6. `rime/weasel` Nightly（Windows 客戶端）
          {weasel_line}

          ### 7. `amzxyz/rime-wanxiang-data`（400 MB LTS 語法模型）
          {gram_line}
          """
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines())

          repo = os.environ["GITHUB_REPOSITORY"]
          title = "[Upstream Watch] 上游引擎與腳本更新追蹤"
          existing = json.loads(subprocess.check_output(
              ["gh", "issue", "list", "-R", repo, "--state", "open", "--search", f'"{title}" in:title', "--json", "number,title"],
              text=True
          ))
          match = next((i for i in existing if i["title"] == title), None)
          if match:
              subprocess.check_call(["gh", "issue", "edit", str(match["number"]), "-R", repo, "--body", body])
              print(f"Updated rolling issue #{match['number']}")
          else:
              subprocess.check_call(["gh", "issue", "create", "-R", repo, "--title", title, "--body", body])
              print("Created rolling issue")
          PY
