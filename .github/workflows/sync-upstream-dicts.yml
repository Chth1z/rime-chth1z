name: Sync Upstream Dictionaries (rime-frost)

on:
  schedule:
    # Weekly Sunday 02:00 UTC+8 (Saturday 18:00 UTC)
    - cron: '0 18 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream-dicts
  cancel-in-progress: false

jobs:
  sync-dicts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fetch upstream rime-frost dictionaries only
        id: sync
        run: |
          git remote add upstream https://github.com/gaboolic/rime-frost.git
          git fetch upstream master --depth=1
          UPSTREAM_SHA=$(git rev-parse --short upstream/master)
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"

          # Sync upstream dictionaries & OpenCC text tables — keep local .ocd2 binaries, lua/, schemas, profiles/, themes/, rules/, and workflows
          git checkout upstream/master -- \
            cn_dicts/ \
            cn_dicts_cell/ \
            en_dicts/ \
            opencc/chinese_english.txt \
            opencc/english_chinese.txt \
            opencc/emoji.txt \
            opencc/others.txt

      - name: Run deterministic dictionary & OpenCC cleaner
        id: clean
        continue-on-error: true
        run: python3 scripts/clean-dicts.py --manifest /tmp/clean-manifest.json

      - name: Run strict dictionary lint, idempotency, collision, and diff-budget gate
        id: lint
        if: steps.clean.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 scripts/dict_lint.py \
            --strict \
            --idempotent \
            --check-collisions \
            --diff-budget \
            --max-active-delta 5000 \
            --max-corrections-delta 50 \
            --max-cn-en-delta 200 \
            --github-output "$GITHUB_OUTPUT" \
            --json /tmp/lint-report.json

      - name: Open issue and halt if cleaner or dictionary lint failed
        if: steps.clean.outcome != 'success' || steps.lint.outcome != 'success' || steps.lint.outputs.lint_ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
        run: |
          TITLE="[CI] 上游词库同步门禁失败 (@ ${UPSTREAM_SHA})"
          python3 - <<'PY' > /tmp/lint-issue.md
          import json, os, pathlib
          p = pathlib.Path("/tmp/lint-report.json")
          print("## 上游词库同步被静态门禁拦截\n")
          if os.environ.get("CLEAN_OUTCOME") != "success":
              print("自动同步 `gaboolic/rime-frost` 后 `scripts/clean-dicts.py` 执行失败，已阻断推送至 `main`。\n")
          else:
              print("自动同步 `gaboolic/rime-frost` 后 `scripts/dict_lint.py` 校验未通过，已阻断推送至 `main`。\n")
          if p.exists():
              r = json.loads(p.read_text(encoding="utf-8"))
              print(f"- 错误数：`{r.get('error_count', 0)}`")
              print(f"- 告警数：`{r.get('warning_count', 0)}`\n")
              if r.get("errors"):
                  print("### 错误明细\n")
                  for err in r["errors"][:30]:
                      print(f"- `{err}`")
          else:
              print("未生成 `/tmp/lint-report.json`，请查看本次 GitHub Actions 日志。")
          PY
          EXISTING=$(gh issue list --state open --search "in:title ${UPSTREAM_SHA}" --json number --jq '.[0].number // empty' || true)
          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "$TITLE" \
              --body-file /tmp/lint-issue.md || true
          else
            echo "Open lint-failure issue #${EXISTING} already exists for ${UPSTREAM_SHA}."
          fi
          exit 1

      - name: Check whether dictionary files changed
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- cn_dicts/ cn_dicts_cell/ en_dicts/ opencc/ rime_frost.dict.yaml)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dictionaries already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- cn_dicts/ cn_dicts_cell/ en_dicts/ opencc/ rime_frost.dict.yaml
          fi

      - name: Circuit breaker — open PR when change exceeds auto-merge budget
        if: steps.diff.outputs.changed == 'true' && steps.lint.outputs.needs_review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          DIFF_SUMMARY: ${{ steps.lint.outputs.diff_summary }}
          REVIEW_REASONS: ${{ steps.lint.outputs.review_reasons }}
        run: |
          BRANCH="chore/dict-sync-${{ steps.sync.outputs.upstream_sha }}"
          git checkout -B "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cn_dicts/ cn_dicts_cell/ en_dicts/ opencc/ rime_frost.dict.yaml
          git commit -m "chore(dicts): sync upstream rime-frost @ ${{ steps.sync.outputs.upstream_sha }} (review required)"
          git push --force origin "HEAD:${BRANCH}"

          python3 - <<'PY' > /tmp/pr-body.md
          import json, os, pathlib
          print("## 上游词库同步触发大变动熔断（需人工复核）\n")
          print(f"- 上游提交：`gaboolic/rime-frost @ {os.environ.get('UPSTREAM_SHA', '')}`")
          print(f"- 变动摘要：`{os.environ.get('DIFF_SUMMARY', '')}`")
          print(f"- 触发原因：`{os.environ.get('REVIEW_REASONS', '')}`\n")
          mp = pathlib.Path("/tmp/clean-manifest.json")
          if mp.exists():
              m = json.loads(mp.read_text(encoding="utf-8"))
              rules = m.get("rules", {})
              if rules:
                  print(f"- 声明式规则命中：`{rules.get('matched_rules', 0)}/{rules.get('total_rules', 0)}`（零命中：`{rules.get('zero_hit_count', 0)}`）\n")
          print("请复核变动并在本机跑完 `bench/accuracy-test.ps1` 与盲测验收后再合入 `main`。")
          PY

          EXISTING_PR=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty' || true)
          if [ -n "$EXISTING_PR" ]; then
            echo "Review PR #${EXISTING_PR} already exists for branch ${BRANCH}; branch updated."
          elif ! gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(dicts): sync upstream rime-frost @ ${{ steps.sync.outputs.upstream_sha }} (review required)" \
            --body-file /tmp/pr-body.md; then
            echo "PR creation unavailable (check repo workflow PR permission); checking fallback issue."
            EXISTING_ISSUE=$(gh issue list --state open --search "in:title ${UPSTREAM_SHA}" --json number --jq '.[0].number // empty' || true)
            if [ -z "$EXISTING_ISSUE" ]; then
              gh issue create \
                --title "[CI] 上游词库同步触发大变动熔断 (@ ${{ steps.sync.outputs.upstream_sha }})" \
                --body-file /tmp/pr-body.md || true
            else
              echo "Open circuit-breaker issue #${EXISTING_ISSUE} already exists for ${UPSTREAM_SHA}."
            fi
          fi

      - name: Commit and push directly to main when within safe diff budget
        if: steps.diff.outputs.changed == 'true' && steps.lint.outputs.needs_review != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cn_dicts/ cn_dicts_cell/ en_dicts/ opencc/ rime_frost.dict.yaml
          git commit -m "chore(dicts): sync upstream rime-frost @ ${{ steps.sync.outputs.upstream_sha }}"
          git push origin HEAD:main
