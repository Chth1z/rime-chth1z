[package]
name = "rime_zhiyi"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "In-process Lua 5.4 ONNX neural sentence reranker for Weasel/librime (Zhiyi ML-pumpkin-1103 KV-cache + Wanxiang .gram fusion + P2C synthesis)"

[lib]
crate-type = ["cdylib"]

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-17"] }
tokenizers = { version = "0.22.1", default-features = false, features = ["fancy-regex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
